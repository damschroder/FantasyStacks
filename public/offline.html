<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#151d21" />
    <title>FantasyStacks is offline</title>
    <style>
      :root { color-scheme: dark; font-family: ui-sans-serif, system-ui, sans-serif; }
      body { align-items: center; background: #111719; color: #f2f0e9; display: flex; margin: 0; min-height: 100vh; }
      main { margin: auto; max-width: 34rem; padding: 2rem; text-align: center; }
      img { height: 5rem; width: 5rem; }
      h1 { font-size: 1.75rem; margin: 1.25rem 0 0.75rem; }
      p { color: #aeb4b6; line-height: 1.6; }
      button { background: #d8ff3e; border: 0; border-radius: 999px; color: #151d21; cursor: pointer; font: inherit; font-weight: 800; padding: 0.75rem 1.25rem; }
    </style>
  </head>
  <body>
    <main>
      <img src="./icons/icon-192.png" alt="" />
      <h1>You’re offline</h1>
      <p>Reconnect to load the latest FantasyStacks data. Previously opened pages may still be available.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
